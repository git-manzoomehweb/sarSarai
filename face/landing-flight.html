    <script type="text/javascript">
        // انتخاب ریشه‌ی فرم
        const __FOOTER_ROOT__ = document.getElementById('contact-form-resize');
        const $_f = (sel) => __FOOTER_ROOT__ ? __FOOTER_ROOT__.querySelector(sel) : null;

        // پیام را به‌صورت متن نمایش بده (XSS-safe)
        function __showMsg__(txt) {
            const box = $_f('.message-api');
            if (box) box.textContent = String(txt ?? '');
        }

        // هایلایت خطا
        function __markInvalid__(el, bad) {
            if (!el) return;
            el.classList.toggle('border-red-500', !!bad); // اگر Tailwind داری
        }

        // نرمال‌سازی اعداد فارسی/عربی و حذف کاراکترهای نامرئی RTL
        const __PERS__ = '۰۱۲۳۴۵۶۷۸۹', __ARAB__ = '٠١٢٣٤٥٦٧٨٩';
        function __toEnglishDigits__(s) {
            return String(s || '').replace(/[۰-۹٠-٩]/g, ch => {
                const i = __PERS__.indexOf(ch); if (i > -1) return String(i);
                const j = __ARAB__.indexOf(ch); if (j > -1) return String(j);
                return ch;
            });
        }
        function __stripBidi__(s) { return String(s || '').replace(/[\u200c\u200e\u200f\u061c\u202a-\u202e]/g, ''); }

        function __sanitizeCaptcha__(v) { return __stripBidi__(v ?? ''); }
        function __sanitizeCaptchaId__(v) { return __stripBidi__(String(v || '')).replace(/[^A-Za-z0-9_-]/g, ''); }
        function __hasTags__(s) { return /<[^>]+>/.test(String(s || '')); }

        // اعتبارسنجی ورودی‌ها (فقط روی همین فرم)
        function __validateFooter__() {
            const fullNameEl = $_f('.contact-fullname-ans input[data-bc-text-input]');
            const phoneEl = $_f('.contact-phone-ans input[data-bc-text-input]');
            const msgEl = $_f('.contact-desc-ans textarea');
            const capEl = $_f('#captchaContainer input[name="captcha"]');
            const capIdEl = $_f('#captchaContainer input[name="captchaid"]');

            const fullName = (fullNameEl?.value || '').trim();
            const phoneDigits = __toEnglishDigits__(phoneEl?.value || '').replace(/\D/g, '');
            const message = (msgEl?.value || '').trim();
            const captcha = __sanitizeCaptcha__(capEl?.value);
            const captchaid = __sanitizeCaptchaId__(capIdEl?.value);

            const errors = [];
            let firstBad = null;

            // ریست هایلایت
            __markInvalid__(fullNameEl, false);
            __markInvalid__(phoneEl, false);
            __markInvalid__(msgEl, false);
            __markInvalid__(capEl, false);

            if (fullName.length < 3) { errors.push('نام و نام خانوادگی را درست وارد کنید.'); __markInvalid__(fullNameEl, true); firstBad = firstBad || fullNameEl; }

            // قانون عمومی: 7 تا 15 رقم؛ اگر خواستی شماره موبایل ایران چک شود بگو تا RegExp بگذارم
            if (phoneDigits.length < 7 || phoneDigits.length > 15) { errors.push('شماره تماس معتبر نیست.'); __markInvalid__(phoneEl, true); firstBad = firstBad || phoneEl; }

            if (message.length < 3 || message.length > 1000 || __hasTags__(message)) { errors.push('پیام باید متن ساده و بین ۳ تا ۱۰۰۰ کاراکتر باشد.'); __markInvalid__(msgEl, true); firstBad = firstBad || msgEl; }

            const rawCaptcha = capEl?.value ?? '';
            const capLen = String(rawCaptcha)
                .replace(/[\u200c\u200e\u200f\u061c\u202a-\u202e]/g, '') // حذف bidi invisibles
                .replace(/\s/g, '')                                       // حذف فاصله
                .length;

            if (capLen !== 4) {
                errors.push('کد امنیتی باید دقیقاً ۴ کاراکتر باشد.');
                __markInvalid__(capEl, true); firstBad = firstBad || capEl;
            }
            if (!captchaid) { errors.push('کپچا معتبر نیست. لطفاً رفرش کنید.'); }

            return { ok: errors.length === 0, errors, focusEl: firstBad, values: { captcha, captchaid } };
        }


        function uploadDocumentFooter(args) {
            // 1) اعتبارسنجی روی کلیک
            const { ok, errors, focusEl, values } = __validateFooter__();
            if (!ok) {
                __showMsg__('لطفاً موارد زیر را اصلاح کنید:\n• ' + errors.join('\n• '));
                if (focusEl) focusEl.focus();
                return; // جلوی ارسال را می‌گیریم
            }

            // 2) اگر اوکی بود، بعد ارسال کن (دستورات $bc دست‌نخورده)
            document.querySelector("#contact-form-resize .Loading_Form").style.display = 'block';

            const captcha = values.captcha;
            const captchaid = values.captchaid;

            const stringJson = JSON.stringify(args.source?.rows[0] ?? {});
            $bc.setSource("cms.uploadFooter", {
                value: stringJson,
                captcha: captcha,
                captchaid: captchaid,
                run: true
            });
        };



        function refreshCaptchaFooter(e) {
            $bc.setSource("captcha.refreshFooter", true);
        };

        function captchaRenderedFooter() {

    <script>
        (function () {
            const ROOT = document.getElementById('contact-form-resize');
            if (!ROOT) return;

            const getInput = () =>
                ROOT.querySelector('#captchaContainer input[name="captcha"]');

            const showMsg = (t) => {
                const b = ROOT.querySelector('.message-api');
                if (b) b.textContent = String(t ?? '');
            };

            // فقط برای شمارش طول: حذف فاصله و کاراکترهای نامرئی جهت‌دهی
            const normalizeForLength = (s) =>
                String(s || '')
                    .replace(/[\u200c\u200e\u200f\u061c\u202a-\u202e]/g, '')
                    .replace(/\s/g, '');

            // هیچ محدودیت کاراکتری نذار؛ فقط محدودیت‌های مزاحم قبلی رو خنثی کن
            function relaxCaptchaRestrictions(input) {
                if (!input) return;

                // اجازه‌ی تایپ هر کاراکتر
                input.type = 'text';
                input.setAttribute('maxlength', '4');
                input.setAttribute('autocomplete', 'off');

                // الگوها/حالت‌های قبلی که فقط عدد می‌خواستن رو بردار
                ['pattern', 'inputmode', 'dir',
                    'onkeypress', 'onkeydown', 'onkeyup', 'oninput', 'onchange', 'onbeforeinput', 'onpaste'
                ].forEach(a => input.removeAttribute(a));

                // اگر اسکریپت دیگری با event delegation جلوی حروف را می‌گیرد، این‌ها خنثی‌اش می‌کنند
                const allow = (e) => { e.stopImmediatePropagation(); };
                ['keypress', 'keydown', 'keyup', 'beforeinput', 'input', 'paste'].forEach(ev => {
                    input.addEventListener(ev, allow, { capture: true });
                });
            }

            // اگر CMS کپچا را دوباره رندر کرد، دوباره آزادش کن
            const prevCaptchaRendered = window.captchaRenderedFooter;
            window.captchaRenderedFooter = function () {
                try { if (typeof prevCaptchaRendered === 'function') prevCaptchaRendered(); } catch { }
                relaxCaptchaRestrictions(getInput());
            };

            // فقط طول = ۴ کاراکتر را چک کن؛ نوع کاراکتر مهم نیست
            const prevUpload = window.uploadDocumentFooter;
            window.uploadDocumentFooter = function (args) {
                const input = getInput();
                if (input) relaxCaptchaRestrictions(input);

                const raw = input ? input.value : '';
                const val = normalizeForLength(raw);

                if (val.length !== 4) {
                    showMsg('کد امنیتی باید دقیقاً ۴ کاراکتر باشد.');
                    if (input) input.focus();
                    return; // جلوی ارسال را بگیر
                }

                // عبور: فلو اصلی و $bc مثل قبل
                return prevUpload.call(this, args);
            };

            // بار اول هم اعمال کن
            relaxCaptchaRestrictions(getInput());
        })();
    </script>
